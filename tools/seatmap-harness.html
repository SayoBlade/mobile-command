<!DOCTYPE html><html><head><meta charset="utf-8"><title>seat map harness</title>
<link rel="stylesheet" href="../styles/shell.css">
<style>
:root, body { --mc-panel:#211f24; --mc-gold:#c8a44d; --mc-round:1; --mc-ink:#ece5d6; --mc-muted:#a59b86;
  --mc-edge:#3b3640; --mc-panel-2:#2a272e; --mc-sunken:#17151b; --mc-font-title:Georgia; }
html,body { margin:0; background:#191720; font-family:system-ui,sans-serif; color:var(--mc-ink); }
.wrap { width:320px; padding:14px; background:var(--mc-panel); }
</style></head><body><div class="wrap">

<div class="mc-dmp-tablemap"><button class="mc-dmp-seat mc-seat-w mc-full" style="--seat-col:#8ab8d8"><i class="fas fa-circle-user"></i><span>Player 2</span></button><button class="mc-dmp-seat mc-seat-n1 mc-full" style="--seat-col:#c8a44d"><i class="fas fa-circle-user"></i><span>Player 1</span></button><div class="mc-dmp-tv"><i class="fas fa-tv"></i><span>TV</span></div><button class="mc-dmp-seat mc-seat-s1 mc-full" style="--seat-col:#7fb069"><i class="fas fa-circle-user"></i><span>Greeny</span></button><button class="mc-dmp-seat mc-seat-n2"><i class="fas fa-plus mc-dmp-seat-empty"></i></button><button class="mc-dmp-seat mc-seat-s2 mc-full" style="--seat-col:#d8a86a"><i class="fas fa-circle-user"></i><span>Forthy</span></button><button class="mc-dmp-seat mc-seat-e"><i class="fas fa-plus mc-dmp-seat-empty"></i></button></div><div class="mc-dmp-story-status">Tap <b>change</b> (or &#9995;), then a seat. A taken seat swaps the two.</div>

<div class="mc-dmp-story-row">
  <i class="fas fa-circle-user" style="color:#7fb069"></i>
  <span class="mc-dmp-story-q">Dana <button class="mc-dmp-seat-move">change</button>
    <span class="mc-dmp-seat-live">&#9679;</span>
    <span class="mc-dmp-pcname">Selene Duskwarden</span></span>
  <button class="mc-dmp-pf-fix"><i class="fas fa-hand-pointer"></i></button>
</div>
<div class="mc-dmp-story-row">
  <i class="fas fa-circle-user" style="color:#8ab8d8"></i>
  <span class="mc-dmp-story-q">Marcus <button class="mc-dmp-seat-move mc-on">pick a seat</button>
    <button class="mc-dmp-pcpick"><i class="fas fa-masks-theater"></i>Brig Ironfoot</button></span>
  <button class="mc-dmp-pf-fix mc-on"><i class="fas fa-hand-pointer"></i></button>
</div>

<div class="mc-dmp-ct-head">
  <span class="mc-dmp-story-status">3 seated</span>
  <button class="mc-dmp-seat-move">change</button>
</div>

</div></body></html>
