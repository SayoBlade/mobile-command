<!DOCTYPE html><html><head><meta charset="utf-8"><title>card table harness</title>
<link rel="stylesheet" href="../styles/shell.css">
<style>
:root, body { --mc-panel:#211f24; --mc-gold:#c8a44d; --mc-round:1; --mc-ink:#ece5d6; --mc-muted:#a59b86;
  --mc-edge:#3b3640; --mc-panel-2:#2a272e; --mc-sunken:#17151b; --mc-font-title:Georgia;
  --mc-title-case:uppercase; --mc-title-track:.06em; }
html, body { margin:0; height:100%; background:#000; }
</style></head><body>
<script>
// A faithful stand-in for card-table.js boardHTML() — six seats, worst case: every player a
// caster (6 cards) with long names. Used to measure the board at a target resolution.
const SEATS = [
  { id:"n1", label:"Top left",  rot:180 }, { id:"n2", label:"Top right",   rot:180 },
  { id:"w",  label:"Left end",  rot:90  }, { id:"e",  label:"Right end",   rot:270 },
  { id:"s1", label:"Bottom left",rot:0  }, { id:"s2", label:"Bottom right",rot:0   }
];
const HAND = ["Species","Background","Class","Abilities","Spells","Gear"];
// Real art shapes, so emblem-vs-artwork detection is exercised: square icons must land in the
// thorn frame, portrait artwork must stay full bleed, and a null img must print once, not twice.
const ART = {
  Species: "/icons/svg/mystery-man.svg",                          // 512² — emblem
  Background: "/icons/skills/melee/weapons-crossed-swords-yellow.webp", // 256² — emblem
  Class: "/systems/dnd5e/icons/svg/items/class.svg",              // 373×355 — emblem
  Abilities: null,                                                // text card
  Spells: "/modules/mobile-command/art/card-face-blank.png",      // 1024×1536 — artwork
  Gear: "/modules/mobile-command/art/card-back.png"               // 1054×1492 — artwork
};
const NAMES = ["Abzarax","Brig Brightbelly","Player Character (3)","Forthy","Selene Duskwarden","Thistle Greenbottle"];
const BACK = "/modules/mobile-command/art/card-back.png";
// Mirrors card-table.js cardHTML(): image cards keep the name strip, text cards drop it (the
// thorn frame already prints the value large — printing both showed "STR 17" twice, live).
const card = (label) => {
  const img = ART[label];
  const name = label === "Abilities" ? "STR 17" : label;
  const art = img ? `<img class="mc-ct-art" src="${img}" alt="">`
                  : `<div class="mc-ct-art mc-ct-art-text">${name}</div>`;
  return `<div class="mc-ct-card mc-ct-flipped"><div class="mc-ct-inner">
    <div class="mc-ct-back" style="background-image:url('${BACK}')"></div>
    <div class="mc-ct-face">${art}${img ? `<div class="mc-ct-name">${name}</div>` : ""}</div>
  </div></div>`;
};
const seat = (d, n) => `<div class="mc-ct-seat" data-seat="${d.id}" style="--mc-ct-rot:${d.rot}deg;--mc-seat:#c8a44d">
  <div class="mc-ct-plate"><span class="mc-ct-who">${NAMES[n]}</span><span class="mc-ct-player">Player ${n+1}</span></div>
  <div class="mc-ct-hand">${HAND.map(card).join("")}</div>
</div>`;
const g = id => SEATS.find(s => s.id === id);
document.body.innerHTML = `<div id="mc-cardtable"><div class="mc-ct-felt"
  style="--mc-ct-table:url('/modules/mobile-command/art/card-table-wide.jpg')">
  <div class="mc-ct-row mc-ct-row-n">${seat(g("n1"),0)}${seat(g("n2"),1)}</div>
  <div class="mc-ct-mid">${seat(g("w"),2)}<div class="mc-ct-center"><div class="mc-ct-candles"><div class="mc-ct-cd-shadow" style="--cx:55.1%;--cy:27.6%;--r:26.5%;--d:0s"></div><div class="mc-ct-cd-shadow" style="--cx:24.9%;--cy:76.9%;--r:24.4%;--d:-0.7s"></div><div class="mc-ct-cd-shadow" style="--cx:78.2%;--cy:78%;--r:19%;--d:-1.4s"></div><img class="mc-ct-cd-art" src="/modules/mobile-command/art/candles-topdown.png" alt=""><video class="mc-ct-cd-fire" style="--wx:55.5%;--wy:27.1%;--fw:23%" src="/modules/animated-fire-by-mattm/fire_animations/small_fire_01_420x420.webm" autoplay loop muted playsinline></video><video class="mc-ct-cd-fire" style="--wx:23.9%;--wy:74.8%;--fw:20%" src="/modules/animated-fire-by-mattm/fire_animations/small_fire_02_420x420.webm" autoplay loop muted playsinline></video><video class="mc-ct-cd-fire" style="--wx:78.8%;--wy:75.7%;--fw:19%" src="/modules/animated-fire-by-mattm/fire_animations/small_fire_03_420x420.webm" autoplay loop muted playsinline></video></div></div>${seat(g("e"),3)}</div>
  <div class="mc-ct-row mc-ct-row-s">${seat(g("s1"),4)}${seat(g("s2"),5)}</div>
</div></div>`;

// Same emblem rule as card-table.js markEmblem().
const EMBLEM_RATIO = 0.85;
for (const img of document.querySelectorAll("img.mc-ct-art")) {
  const mark = () => { const w = img.naturalWidth, h = img.naturalHeight;
    if (w && h && w / h > EMBLEM_RATIO) img.closest(".mc-ct-face")?.classList.add("mc-ct-emblem"); };
  if (img.complete) mark(); else img.addEventListener("load", mark, { once: true });
}

// Measure: getBoundingClientRect IS transform-aware, so these are the boxes the eye sees.
window.mcMeasure = () => {
  const vw = innerWidth, vh = innerHeight;
  const out = { viewport: [vw, vh], card: null, seats: [], overflow: [] };
  const c = document.querySelector(".mc-ct-card").getBoundingClientRect();
  out.card = [Math.round(c.width), Math.round(c.height)];
  for (const el of document.querySelectorAll(".mc-ct-seat")) {
    const r = el.getBoundingClientRect();
    const box = { id: el.dataset.seat, x: Math.round(r.left), y: Math.round(r.top),
      w: Math.round(r.width), h: Math.round(r.height) };
    out.seats.push(box);
    const bleed = [];
    if (r.left < 0) bleed.push(`left ${Math.round(-r.left)}px`);
    if (r.top < 0) bleed.push(`top ${Math.round(-r.top)}px`);
    if (r.right > vw) bleed.push(`right ${Math.round(r.right - vw)}px`);
    if (r.bottom > vh) bleed.push(`bottom ${Math.round(r.bottom - vh)}px`);
    if (bleed.length) out.overflow.push(`${box.id}: ${bleed.join(", ")}`);
  }
  // Do any two seats visually collide?
  for (let i = 0; i < out.seats.length; i++) for (let j = i + 1; j < out.seats.length; j++) {
    const a = out.seats[i], b = out.seats[j];
    const ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
    const oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ox > 2 && oy > 2) out.overflow.push(`${a.id}✕${b.id} overlap ${ox}×${oy}px`);
  }
  return JSON.stringify(out);
};
</script>
</body></html>
